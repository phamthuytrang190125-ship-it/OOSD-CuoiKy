<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lỗi hệ thống - ENV-REPORT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .error-card { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; max-width: 500px; width: 100%; border: 1px solid #eef2f0; }
        .error-icon { font-size: 64px; color: #dc3545; margin-bottom: 20px; }
        h1 { margin: 0 0 10px; color: #2c3e50; font-size: 24px; }
        p { color: #6c757d; margin-bottom: 30px; font-size: 15px; line-height: 1.5; }
        .btn-home { background-color: #28a745; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 12px rgba(40,167,69,0.2); }
        .btn-home:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1>Đã xảy ra lỗi hệ thống!</h1>
        <p>Đường dẫn bạn truy cập không tồn tại hoặc hệ thống đang gặp sự cố tạm thời. Vui lòng quay lại trang chủ.</p>
        <a href="/" class="btn-home"><i class="fa-solid fa-house"></i> Về trang chủ</a>
    </div>
</body>
</html>
